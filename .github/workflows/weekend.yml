name: weekend
# каждые 30 минут забирает свежие афиши из t.me/loungeliwan в weekend/ (блок Weekend на сайте)
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: weekend
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/weekend.py
      - name: commit
        run: |
          git config user.name "liwan-weekend"
          git config user.email "liwan-weekend@users.noreply.github.com"
          git add weekend
          git diff --cached --quiet || (git commit -m "Weekend: обновление афиш" && git push)
